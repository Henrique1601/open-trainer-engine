<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>HUD Overlay & OSD Toasts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;800&family=Outfit:wght@700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root, body[data-theme="wemod"] {
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.5);
      --bg: rgba(10, 14, 22, 0.92);
      --border: rgba(255, 255, 255, 0.12);
    }
    body[data-theme="cyberpunk"] {
      --accent: #fcee0a;
      --accent-glow: rgba(252, 238, 10, 0.6);
      --bg: rgba(8, 10, 15, 0.94);
      --border: rgba(0, 240, 255, 0.3);
    }
    body[data-theme="obsidian"] {
      --accent: #a855f7;
      --accent-glow: rgba(168, 85, 247, 0.55);
      --bg: rgba(13, 9, 26, 0.92);
      --border: rgba(168, 85, 247, 0.3);
    }
    body[data-theme="crimson"] {
      --accent: #ff2a4b;
      --accent-glow: rgba(255, 42, 75, 0.55);
      --bg: rgba(16, 8, 10, 0.94);
      --border: rgba(255, 42, 75, 0.3);
    }
    body[data-theme="frost"] {
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.55);
      --bg: rgba(10, 18, 32, 0.92);
      --border: rgba(56, 189, 248, 0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
    body {
      background: transparent;
      color: #f8fafc;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 12px;
      user-select: none;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* In-Game OSD Toasts Flutuantes */
    #osd-container {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
      z-index: 9999;
    }

    .osd-toast {
      background: var(--bg);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.75), 0 0 16px var(--accent-glow);
      backdrop-filter: blur(16px);
      animation: slideInDown 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      transition: all 0.3s ease;
    }
    .osd-toast.on {
      border-left-color: var(--accent);
    }
    .osd-toast.off {
      border-left-color: #ef4444;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.75);
    }
    .osd-toast.fade-out {
      opacity: 0;
      transform: translateY(-10px);
    }

    @keyframes slideInDown {
      from { opacity: 0; transform: translateY(-16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Menu do HUD Overlay */
    #overlay-menu {
      background: var(--bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8), 0 0 20px var(--accent-glow);
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .title-group h2 {
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      font-weight: 900;
      color: var(--accent);
      letter-spacing: -0.2px;
      text-transform: uppercase;
      text-shadow: 0 0 10px var(--accent-glow);
    }
    .title-group span {
      font-size: 10.5px;
      color: #94a3b8;
      font-weight: 600;
    }
    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }

    .tools-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }
    .tool-btn {
      flex: 1;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: #f8fafc;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .tool-btn:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: var(--accent);
    }
    .tool-btn.active {
      background: #f59e0b;
      color: #000;
      border-color: #f59e0b;
      box-shadow: 0 0 14px rgba(245, 158, 11, 0.5);
    }

    #cheats-list {
      flex: 1;
      overflow-y: auto;
      scrollbar-width: thin;
    }
    .cheat-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 12px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.04);
      margin-bottom: 6px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      border: 1px solid transparent;
    }
    .cheat-item:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.15);
    }
    .cheat-item.active {
      background: rgba(16, 185, 129, 0.14);
      border-color: var(--accent);
      color: var(--accent);
    }
    .hotkey-badge {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 2px 7px;
      border-radius: 5px;
      font-family: 'JetBrains Mono', Consolas, monospace;
      font-size: 10.5px;
      color: var(--accent);
      margin-right: 8px;
      font-weight: 800;
    }
    .cheat-status {
      font-size: 10.5px;
      font-weight: 800;
      color: #94a3b8;
      font-family: 'JetBrains Mono', Consolas, monospace;
    }
    .cheat-status.on {
      color: var(--accent);
      text-shadow: 0 0 8px var(--accent-glow);
    }
  </style>
</head>
<body>

  <!-- In-Game OSD Toasts -->
  <div id="osd-container"></div>

  <!-- HUD Overlay Menu -->
  <div id="overlay-menu">
    <header>
      <div class="title-group">
        <h2>In-Game HUD Overlay</h2>
        <span>Ctrl+G alternar • F11 Screenshot</span>
      </div>
      <div class="status-dot"></div>
    </header>

    <!-- Barra de Ferramentas In-Game (Auto-Pause e Captura) -->
    <div class="tools-bar">
      <button class="tool-btn" id="btn-pause-game" onclick="toggleGamePause()">
        <span>⏸</span> Auto-Pause
      </button>
      <button class="tool-btn" onclick="takeInGameScreenshot()">
        <span>📷</span> Screenshot
      </button>
    </div>

    <!-- Lista de Cheats do Jogo -->
    <div id="cheats-list">
      <div style="color: #94a3b8; font-size: 12px; text-align: center; padding: 24px;">
        Nenhum jogo ou trainer anexado no momento.
      </div>
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    let currentCheats = [];

    // Sincroniza tema com a janela principal
    ipcRenderer.on('theme:changed', (_event, themeId) => {
      document.body.setAttribute('data-theme', themeId);
    });

    // OSD Toast Notification
    function showOsdToast(title, message, isEnabled) {
      const container = document.getElementById('osd-container');
      const toast = document.createElement('div');
      toast.className = `osd-toast ${isEnabled ? 'on' : 'off'}`;
      toast.innerHTML = `
        <div style="display: flex; align-items: center; gap: 8px;">
          <span>${isEnabled ? '🟢' : '⚪'}</span>
          <span>${title}</span>
        </div>
        <span style="font-size: 11px; opacity: 0.9;">${message}</span>
      `;
      container.appendChild(toast);

      setTimeout(() => {
        toast.classList.add('fade-out');
        setTimeout(() => toast.remove(), 300);
      }, 2500);
    }

    // Recebe evento de alternância de cheat (Ativação de Mod)
    ipcRenderer.on('cheat-toggled-event', (_event, data) => {
      const el = document.getElementById(`status-${data.cheatId}`);
      if (el) {
        el.innerText = data.enabled ? 'ON' : 'OFF';
        el.className = `cheat-status ${data.enabled ? 'on' : ''}`;
        el.closest('.cheat-item').className = `cheat-item ${data.enabled ? 'active' : ''}`;
      }
      showOsdToast(data.cheatName || data.cheatId, data.enabled ? 'MOD ATIVADO' : 'MOD DESATIVADO', data.enabled);
    });

    // Recebe atualização de lista de cheats do jogo ativo
    ipcRenderer.on('sync-overlay-cheats', (_event, data) => {
      const list = document.getElementById('cheats-list');
      if (!data.cheats || data.cheats.length === 0) {
        list.innerHTML = '<div style="color: #94a3b8; font-size: 12px; text-align: center; padding: 24px;">Nenhum trainer ativo no momento.</div>';
        return;
      }
      currentCheats = data.cheats;
      list.innerHTML = data.cheats.map(c => `
        <div class="cheat-item ${c.active ? 'active' : ''}" onclick="toggleCheat('${c.id}')">
          <div>
            ${c.hotkey ? `<span class="hotkey-badge">${c.hotkey}</span>` : ''}
            <span>${c.name}</span>
          </div>
          <span class="cheat-status ${c.active ? 'on' : ''}" id="status-${c.id}">${c.active ? 'ON' : 'OFF'}</span>
        </div>
      `).join('');
    });

    // Notificação de screenshot capturada
    ipcRenderer.on('screenshot-taken-event', (_event, data) => {
      showOsdToast('Screenshot Salva', data.fileName || 'Captura registrada', true);
    });

    async function toggleCheat(cheatId) {
      await ipcRenderer.invoke('toggle-cheat', cheatId);
    }

    async function toggleGamePause() {
      const btn = document.getElementById('btn-pause-game');
      const res = await ipcRenderer.invoke('game:toggle-pause');
      if (res.isPaused) {
        btn.classList.add('active');
        btn.innerHTML = '<span>▶</span> Pausado';
        showOsdToast('Game Paused', 'Thread do jogo congelada com segurança', true);
      } else {
        btn.classList.remove('active');
        btn.innerHTML = '<span>⏸</span> Auto-Pause';
        showOsdToast('Game Resumed', 'Execução do jogo retomada', false);
      }
    }

    async function takeInGameScreenshot() {
      await ipcRenderer.invoke('game:capture-screenshot');
    }
  </script>
</body>
</html>
